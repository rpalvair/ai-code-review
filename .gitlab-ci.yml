stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.color=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

backend:build:
  stage: build
  image: maven:3-eclipse-temurin-25
  script:
    - mvn -f backend/pom.xml --batch-mode package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour

backend:test:
  stage: test
  image: maven:3-eclipse-temurin-25
  script:
    - mvn -f backend/pom.xml --batch-mode test
  needs:
    - backend:build
